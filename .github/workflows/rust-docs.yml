name: Rust Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: '0.4.36'
      - name: Provision Playwright Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Build Rustic docs host + wasm bundle
        run: cargo xtask docs-build
      - name: Run Rustic docs wasm smoke tests
        run: cargo xtask docs-test
      - name: Validate docs packaging pipeline (dry-run)
        run: cargo xtask docs-package --dry-run
      - name: Assemble deploy-ready docs artifacts
        run: cargo xtask docs-package
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/deploy/docs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

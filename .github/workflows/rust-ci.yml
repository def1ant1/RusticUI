name: Rust Workspace CI

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      # Pull the code so the linter operates on the latest sources
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install stable toolchain with formatting and linting components
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Cache dependencies to speed up repeated CI runs
      - uses: Swatinem/rust-cache@v2
      # Install cargo-deny so the xtask supply-chain audit can execute
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Enforce consistent style across the workspace
      - run: cargo xtask fmt --check
      # Fail on any warnings to keep code quality high
      - run: cargo xtask clippy
      # Audit the dependency graph for advisories, bans, and license drift
      - run: cargo xtask deny

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository for testing
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install toolchain with LLVM tools required for coverage
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
          target: wasm32-unknown-unknown
      # Reuse build artifacts between runs
      - uses: Swatinem/rust-cache@v2
      # Compile the workspace and wasm examples before collecting coverage
      - run: cargo xtask test --examples
      # Compile layout demos for native and wasm targets to keep gallery builds green
      - run: cargo xtask examples --group layout --release
      # Execute tests and generate coverage in one step
      - run: cargo xtask coverage
      # Publish coverage statistics to external service
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
        if: success()

  wasm:
    name: WebAssembly Tests
    runs-on: ubuntu-latest
    steps:
      # Checkout sources for wasm-enabled crates
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install the wasm target for browser-based test execution
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      # Share compiled artifacts between CI runs
      - uses: Swatinem/rust-cache@v2
      # Install wasm-pack for running browser tests
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      # Execute headless browser tests for wasm-enabled crates
      - name: Run wasm tests
        run: cargo xtask wasm-test

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so documentation reflects current code
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install the standard toolchain
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      # Cache build output to speed up doc rebuilds
      - uses: Swatinem/rust-cache@v2
      # Generate API documentation for all crates
      - run: cargo xtask doc
      # Publish the docs as an artifact so they can be inspected from the CI UI
      - uses: actions/upload-artifact@v4
        with:
          name: rust-docs
          path: target/doc

  bench:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      # Checkout source code for benchmarking
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install the Rust toolchain
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      # Cache compiled dependencies for faster benchmarking
      - uses: Swatinem/rust-cache@v2
      # Run any defined Criterion benches; tolerate absence gracefully
      - run: cargo xtask bench
      # Record release artifact sizes across feature matrices
      - run: cargo xtask bundle-report
      # Upload benchmark reports for inspection and future comparison
      - uses: actions/upload-artifact@v4
        with:
          name: rust-benchmarks
          path: target/criterion
          if-no-files-found: ignore
      # Publish bundle-size telemetry alongside the benchmark output
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: |
            test-results/bundle-size
            docs/performance/bundle-costs.md
            docs/performance/bundle-costs.json
          if-no-files-found: ignore

  automation:
    name: Docs & Asset Automation
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so automation tasks operate on latest sources
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Install the Rust toolchain used by cargo-xtask
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      # Refresh icon bindings from upstream Material icons
      - run: cargo xtask icon-update
      # Rebuild Material parity snapshots to keep docs in sync
      - name: Generate Material parity report
        run: cargo xtask material-parity
      # Capture the Joy UI component inventory so regressions surface quickly in diffs
      - name: Generate Joy component parity report
        run: cargo xtask joy-inventory
      # Refresh the cross-adapter parity dashboard used by docs navigation
      - name: Generate adapter parity report
        run: cargo xtask parity-report
      - name: Ensure adapter parity report committed
        run: git diff --exit-code docs/architecture/adapter-parity.md
      # Persist the generated markdown so subsequent jobs (and workflow runs) can diff it cheaply
      - name: Cache Joy parity report
        uses: actions/cache@v4
        with:
          path: docs/joy-component-parity.md
          key: joy-parity-${{ github.sha }}
          restore-keys: |
            joy-parity-
      # Fail fast when the inventory drifts to force contributors to commit the refreshed snapshot
      - name: Ensure Joy parity report committed
        run: git diff --exit-code docs/joy-component-parity.md
      # Ensure the Rust-first documentation stack builds cleanly
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: cargo xtask docs-build
      # Assemble distributable icon bundles for compatibility consumers
      - run: cargo xtask icons-bundle --compat
      # Assemble distributable theme bundles for compatibility consumers
      - run: cargo xtask themes-bundle --compat

  accessibility:
    name: Accessibility Audits
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Derive pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('docs/package.json', 'test/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/package.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile=false
      - name: Install test dependencies
        run: pnpm --dir test install --frozen-lockfile=false
      - name: Install Playwright Chromium bundle
        run: pnpm --dir test exec playwright install --with-deps chromium
      - name: Run accessibility harness
        run: pnpm --dir test run accessibility
      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: test-results/accessibility
          if-no-files-found: error

  publish-check:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      # Validate that each crate is ready for publication by running a dry run
      # `cargo publish`. This catches missing metadata or ignored files early.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for crate in crates/*; do
            if [ -f "$crate/Cargo.toml" ]; then
              (cd "$crate" && cargo publish --dry-run)
            fi
          done

  selection-controls:
    name: Selection Controls Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
    steps:
      # Checkout the repository to access the Rust test suites
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Provision the Rust toolchain and linting components consumed by cargo xtask
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Ensure mdBook is available for the Rust-first documentation build invoked by cargo xtask
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Playwright dependencies (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Enforce the Rust-only toolchain expectations before running expensive work
      - name: Verify Rust-first toolchain guardrails
        run: cargo xtask verify-toolchain
      - name: Enforce formatting
        run: cargo xtask fmt --check
      - name: Enforce linting
        run: cargo xtask clippy
      - name: Run Rust selection control suites
        run: cargo xtask selection-controls --skip-web
      - name: Build docs host + wasm bundle
        run: cargo xtask docs-build
      - name: Run docs wasm smoke tests (${{ matrix.browser }})
        run: cargo xtask docs-test
      - name: Validate docs packaging flow
        run: cargo xtask docs-package --dry-run

  select-menu-examples:
    name: Select Menu Example Smoke Tests
    runs-on: ubuntu-latest
    steps:
      # Ensure the examples build against the latest shared helpers
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: select-menu-examples
      - name: Check Yew WASM build
        run: cargo check --target wasm32-unknown-unknown --manifest-path examples/select-menu-yew/Cargo.toml
      - name: SSR snapshot Yew demo
        run: cargo run --manifest-path examples/select-menu-yew/Cargo.toml --no-default-features --features ssr
      - name: Check Leptos WASM build
        run: cargo check --target wasm32-unknown-unknown --manifest-path examples/select-menu-leptos/Cargo.toml
      - name: SSR snapshot Leptos demo
        run: cargo run --manifest-path examples/select-menu-leptos/Cargo.toml --no-default-features --features ssr

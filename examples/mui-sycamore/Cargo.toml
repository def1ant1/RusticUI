[package]
name = "rustic_ui_sycamore_example"
version = "0.1.0"
edition = "2021"

[dependencies]
sycamore.workspace = true
rustic-ui-system = { path = "../../crates/rustic-ui-system", features = ["sycamore"] }
tokio = { workspace = true, optional = true }
mui-shared = { path = "../mui-shared" }
sycamore-router = "0.9.2"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "HtmlSelectElement", "HtmlInputElement", "EventTarget"] }
wasm-bindgen = "0.2"

[features]
default = ["csr"]
csr = []
ssr = ["tokio"]

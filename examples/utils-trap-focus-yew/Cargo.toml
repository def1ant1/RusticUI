[package]
name = "utils-trap-focus-yew"
version = "0.1.0"
edition = "2021"
description = "Yew harness demonstrating rustic-ui focus trap sentinels."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "utils_trap_focus_yew"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[dependencies]
utils-trap-focus-core = { path = "../utils-trap-focus-core" }
yew.workspace = true
rustic-ui-material = { path = "../../crates/rustic-ui-material", version = "0.1.0", features = ["yew"] }
rustic-ui-styled-engine = { path = "../../crates/rustic-ui-styled-engine", version = "0.1.0", features = ["yew"] }
wasm-bindgen.workspace = true

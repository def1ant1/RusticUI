[package]
name = "mui-shared"
version = "0.1.0"
edition = "2021"
description = "Shared Material UI example primitives for multi-framework RusticUI demos."
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustic-ui-system = { path = "../../crates/rustic-ui-system" }
html-escape = "0.2"

[dev-dependencies]

[features]
# Keep the crate lean by allowing consumers to opt into only the modules they
# require.  The defaults mirror the historical behaviour (all primitives
# enabled) so existing examples continue to compile while newer ones can
# cherry-pick the exact surfaces they consume.
default = ["automation", "routes", "layout", "theme"]
automation = []
routes = ["automation"]
layout = ["routes", "automation", "theme"]
theme = []
ssr = []
csr = []

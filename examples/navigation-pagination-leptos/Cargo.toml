[package]
name = "navigation_pagination_leptos"
version = "0.1.0"
edition = "2021"
description = "Leptos pagination navigation showcase with SSR telemetry"
publish = false
license.workspace = true

[lib]
name = "navigation_pagination_leptos"
path = "src/lib.rs"

[[bin]]
name = "navigation-pagination-leptos"
path = "src/main.rs"

[dependencies]
leptos.workspace = true
rustic-ui-headless = { path = "../../crates/rustic-ui-headless" }
rustic-ui-material = { path = "../../crates/rustic-ui-material" }
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["serde"] }
wasm-bindgen.workspace = true
tokio = { workspace = true, optional = true }
htmlescape = "0.3"

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr", "tokio"]

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "ssr"
path = "tests/ssr.rs"
required-features = ["ssr"]


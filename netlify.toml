[build]
  # The deploy-ready HTML files and assets generated by the build.
  publish = "target/deploy/docs"

  # Build command.
  #
  # Netlify now calls the Rust-native deployment pipeline which stitches the
  # cargo doc output, mdBook site, and release wasm bundles into
  # `target/deploy/docs`. The `deploy-docs` task executes every prerequisite
  # command (including wasm compilation) so the hosting environment only needs
  # the Rust toolchain plus mdBook.
  command = "cargo xtask deploy-docs"

[[plugins]]
  package = "./packages/netlify-plugin-cache-docs"

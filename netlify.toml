[build]
  # The deploy-ready HTML files and assets generated by the build.
  publish = "target/deploy/docs"

  # Build command.
  #
  # Netlify now shells through the Rust-native packaging pipeline which stitches the
  # cargo doc output, mdBook site, and release wasm bundles into
  # `target/deploy/docs`. The `docs-package` task executes every prerequisite
  # command (including wasm compilation) so the hosting environment only needs
  # the Rust toolchain plus mdBook and Playwright's Chromium runtime.
  command = "cargo xtask docs-package"

[[plugins]]
  package = "./packages/netlify-plugin-cache-docs"
